name: One-shot repair PR67 merged contracts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync
      - name: Repair merged steering and test contracts
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          
          # Repair the generated regex word-boundary escape in the merged steering detector.
          p = Path("src/adapters/chatgpt-web/environment.ts")
          t = p.read_text()
          if chr(8) not in t:
              raise SystemExit("expected generated backspace escape is absent")
          t = t.replace(chr(8), r"\b")
          p.write_text(t)
          
          # Our fork intentionally keeps account cooldowns retryable/passive; upstream's new tests
          # inherited the upstream non-retryable policy. Reconcile only this rate-limit test block.
          p = Path("tests/browser-worker-contract.test.ts")
          t = p.read_text()
          start = t.index('test("the known ChatGPT rate-limit dialog is detected passively')
          end = t.index('test("unrelated ChatGPT dialogs are left untouched', start)
          block = t[start:end]
          if "retryable: false" not in block:
              raise SystemExit("rate-limit expectation block changed")
          block = block.replace("retryable: false", "retryable: true")
          t = t[:start] + block + t[end:]
          p.write_text(t)
          
          # The old fourth-part planner fixture is redundant now that 6 is the only large shape.
          # Also recognize that the sparse composer-limit case is intentionally fragmented by our fork.
          p = Path("tests/chatgpt-web-usage.test.ts")
          t = p.read_text()
          t = t.replace(
              '    [Array.from({ length: 4 }, () => "word ".repeat(50_000)), 6],\n',
              '',
              1,
          )
          old = """  const stagedPro = compileChatGptWebPrompt(sparsePro, capabilities, undefined, { experimentalMultipartParts: 2 });
            expect(stagedPro.multipart!.parts.flatMap(part => JSON.parse(part).records).map(record => record.message.content))
              .toEqual([sparsePro.context.messages[0]!.content]);
          """
          new = """  const stagedPro = compileChatGptWebPrompt(sparsePro, capabilities, undefined, { experimentalMultipartParts: 2 });
            const sparseRecords = stagedPro.multipart!.parts.flatMap(part => JSON.parse(part).records);
            const sparseFragments = sparseRecords.filter(record => record.kind === "record_fragment");
            expect(sparseFragments.length).toBeGreaterThan(1);
            const rebuiltSparse = JSON.parse(sparseFragments.map(fragment => fragment.json_fragment).join(""));
            expect(rebuiltSparse.kind).toBe("message");
            expect(rebuiltSparse.message_index).toBe(0);
            expect(rebuiltSparse.message.content).toBe(sparsePro.context.messages[0]!.content);
          """
          if old not in t:
              raise SystemExit("sparse Pro planner assertion changed")
          p.write_text(t.replace(old, new, 1))
          
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adapters/chatgpt-web/environment.ts tests/browser-worker-contract.test.ts tests/chatgpt-web-usage.test.ts
          git diff --cached --check
          git commit -m "fix: reconcile steering and fork recovery contracts"
          git push origin HEAD:sync
