name: Repair passive rate-limit contract
on:
  push:
    branches: [rate-limit-backoff]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore and update contract tests
        shell: bash
        run: |
          set -euo pipefail
          git show 89625e9e7f6d1cc72802b4d674adc136be3ca9c1:tests/browser-worker-contract.test.ts > tests/browser-worker-contract.test.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/browser-worker-contract.test.ts')
          s = p.read_text()
          replacements = {
            'the known ChatGPT rate-limit dialog is acknowledged and returns a structured 429': 'the known ChatGPT rate-limit dialog is detected passively and returns a structured 429',
            'submission acceptance reports a rate-limit dialog that appears after Enter': 'submission acceptance passively reports a rate-limit dialog that appears after Enter',
            'the Traditional Chinese ChatGPT rate-limit dialog is acknowledged and returns a structured 429': 'the Traditional Chinese ChatGPT rate-limit dialog is detected passively and returns a structured 429',
            'the Simplified Chinese ChatGPT rate-limit dialog is acknowledged and returns a structured 429': 'the Simplified Chinese ChatGPT rate-limit dialog is detected passively and returns a structured 429',
            'the Japanese ChatGPT rate-limit dialog is acknowledged and returns a structured 429': 'the Japanese ChatGPT rate-limit dialog is detected passively and returns a structured 429',
          }
          for old, new in replacements.items(): s = s.replace(old, new)
          a = s.index('test("the known ChatGPT rate-limit')
          b = s.index('test("unrelated ChatGPT dialogs', a)
          block = s[a:b].replace('expect(fixture.pressed).toEqual(["Enter"]);', 'expect(fixture.pressed).toEqual([]);')
          if block.count('expect(fixture.pressed).toEqual([]);') != 5:
              raise SystemExit('expected five passive dialog assertions')
          p.write_text(s[:a] + block + s[b:])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/browser-worker-contract.test.ts
          git commit -m 'Fix passive rate-limit contract expectations'
          git push
