name: One-shot rollout workspace profile compatibility

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/rollout-workspace-profile-compat
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Apply rollout compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/rollout-profile.patch.gz.b64 <<'B64'

          B64
          base64 -d /tmp/rollout-profile.patch.gz.b64 | gzip -dc > /tmp/rollout-profile.patch
          git apply --check /tmp/rollout-profile.patch
          git apply /tmp/rollout-profile.patch
          git diff --check

      - name: Verify
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd launcher
          bun run verify

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adapters/chatgpt-web/codex-rollout-environment.ts tests/environment.test.ts
          git commit -m "fix: accept nested workspace-write rollout grants"
          git push origin HEAD:fix/rollout-workspace-profile-compat
