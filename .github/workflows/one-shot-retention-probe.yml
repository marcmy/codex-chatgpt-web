name: One-shot Even Bigger Retention Probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/unified-web-model-steering
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Apply retention probe patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/one-shot-retention.patch.gz.b64 > /tmp/retention.b64
          python <<'PY'
          from pathlib import Path
          path = Path("/tmp/retention.b64")
          chars = list(path.read_text())
          repairs = {
              4805: "J",
              6572: "s",
              6647: "v",
              6716: "u",
              6718: "n",
              6719: "c",
              6720: "z",
              6722: "R",
              6725: "x",
          }
          for index, value in repairs.items():
              chars[index] = value
          path.write_text("".join(chars))
          PY
          base64 -d /tmp/retention.b64 | gzip -dc > /tmp/retention.patch
          git apply --check /tmp/retention.patch
          git apply /tmp/retention.patch
          git diff --check
      - name: Verify retention contracts
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd launcher
          bun test tests/prompt-contract.test.ts tests/browser-worker-contract.test.ts
          bun run verify
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "feat: add Even Bigger Context retention probes"
          git push origin HEAD:feature/unified-web-model-steering
