name: One-shot fix PR67 prompt syntax

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync
      - name: Fix prompt comment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/adapters/chatgpt-web/prompt.ts")
          t = p.read_text()
          t = t.replace("\\/** Bigger Context may use six physical browser messages while logical capacity stays 3x. */",
                        "/** Bigger Context may use six physical browser messages while logical capacity stays 3x. */", 1)
          p.write_text(t)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adapters/chatgpt-web/prompt.ts
          git diff --cached --check
          git commit -m "fix: repair merged Bigger Context comment"
          git push origin HEAD:sync
