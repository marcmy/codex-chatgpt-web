name: Repair stale rate-limit tests
on:
  push:
    branches: [rate-limit-backoff]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rate-limit-backoff
      - name: Locate stale contracts
        run: |
          grep -RniE "acknowledg|rate-limit dialog|rate limit dialog" . --exclude-dir=.git | head -200
          exit 1
