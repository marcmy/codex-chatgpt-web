name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths: [.github/workflows/sync-upstream.yml]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out fork branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Prepare upstream integration
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/miuuyy/codex-chatgpt-web.git
          git fetch --prune --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork already contains current upstream main."
            exit 0
          fi
          original_head="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse upstream/main)"
          sync_branch="codex/sync-upstream-${upstream_sha:0:12}-${original_head:0:12}"
          existing_pr="$(gh pr list --head "$sync_branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing_pr" ]]; then
            echo "Upstream integration already has PR #$existing_pr."
            exit 0
          fi
          git switch -c "$sync_branch"
          # A conflict needs deliberate integration. Never choose a side automatically.
          if ! git merge --no-commit --no-ff upstream/main; then
            echo "::error::Upstream conflicts with the fork. Resolve it in a reviewed PR; main has not changed."
            exit 1
          fi
          # Workflow policy is owned by this fork, including the validation gates below.
          git restore --source="$original_head" --staged --worktree -- .github
          git commit -m "Merge upstream $upstream_sha"
          echo "branch=$sync_branch" >> "$GITHUB_OUTPUT"
          echo "sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
        if: steps.prepare.outputs.changed == 'true'
      - run: bun install --frozen-lockfile
        if: steps.prepare.outputs.changed == 'true'
        working-directory: launcher
      - name: Validate merged code before publishing
        if: steps.prepare.outputs.changed == 'true'
        run: bun run verify
      - name: Open integration PR and run platform CI
        if: steps.prepare.outputs.changed == 'true'
        env:
          SYNC_BRANCH: ${{ steps.prepare.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.prepare.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/$SYNC_BRANCH"
          printf 'Integrates upstream commit `%s` while preserving fork workflows.\n\nValidation: frozen dependency installs and `bun run verify` passed before this branch was pushed. Platform CI is dispatched explicitly because GITHUB_TOKEN-created pushes and PRs do not trigger it automatically.\n' "$UPSTREAM_SHA" > "$RUNNER_TEMP/upstream-pr.md"
          gh pr create --base main --head "$SYNC_BRANCH" --title "Sync upstream ${UPSTREAM_SHA:0:12}" --body-file "$RUNNER_TEMP/upstream-pr.md"
          gh workflow run ci.yml --ref "$SYNC_BRANCH"
