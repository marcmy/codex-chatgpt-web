name: One-shot Even Bigger Flag Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/unified-web-model-steering
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Fix Even Bigger base-budget capability derivation
        shell: python
        run: |
          from pathlib import Path

          for file in [
              Path("src/chatgpt-web-models.ts"),
              Path("src/adapters/chatgpt-web/usage.ts"),
          ]:
              text = file.read_text()
              old = "{ ...capabilities, experimentalBiggerContext: false }"
              new = "{ ...capabilities, experimentalBiggerContext: false, experimentalEvenBiggerContext: false }"
              if text.count(old) != 1:
                  raise SystemExit(f"{file}: expected exactly one base-context capability override, found {text.count(old)}")
              file.write_text(text.replace(old, new, 1))

          test_file = Path("tests/chatgpt-web-usage.test.ts")
          text = test_file.read_text()
          marker = 'test("multipart selection accounts for whole-record and composer fit before submission", () => {'
          regression = '''test("Even Bigger Context can derive ordinary per-message budgets without violating its parent invariant", () => {
            const evenBigger = {
              ...capabilities,
              experimentalBiggerContext: true,
              experimentalEvenBiggerContext: true,
            };
            expect(resolveBiggerContextMultipartParts(request("small task"), evenBigger)).toBeUndefined();
          });

          '''
          if regression.strip() in text:
              raise SystemExit("regression test already present")
          if marker not in text:
              raise SystemExit("usage test insertion marker changed")
          test_file.write_text(text.replace(marker, regression + marker, 1))
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd launcher
          bun test tests/chatgpt-web-usage.test.ts
          bun run verify
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/chatgpt-web-models.ts src/adapters/chatgpt-web/usage.ts tests/chatgpt-web-usage.test.ts
          git commit -m "fix: preserve Even Bigger Context parent invariant"
          git push origin HEAD:feature/unified-web-model-steering
