name: One-shot finish PR67 planner test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync
      - name: Update planner expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tests/chatgpt-web-usage.test.ts")
          t = p.read_text()
          old = '''  expect(resolveChatGptWebMultipartStagingMode(
            "gpt-5.6-sol", capabilities, estimateTokens(proMessages[0]!), proMessages[0]!.length,
          ).effort).toBe("max");
          }, 60_000);
          '''
          new = '''  expect(resolveChatGptWebMultipartStagingMode(
            "gpt-5.6-sol", capabilities, estimateTokens(proMessages[0]!), proMessages[0]!.length,
          ).effort).toBe("low");
          }, 90_000);
          '''
          if old not in t:
              raise SystemExit("planner expectation anchor changed")
          p.write_text(t.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/chatgpt-web-usage.test.ts
          git diff --cached --check
          git commit -m "test: update six-part planner staging expectation"
          git push origin HEAD:sync
