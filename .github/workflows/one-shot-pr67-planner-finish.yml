name: One-shot finish PR67 planner test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync
      - name: Update planner expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tests/chatgpt-web-usage.test.ts")
          t = p.read_text()
          start = t.index('test("multipart selection accounts for whole-record and composer fit before submission"')
          end = t.index('test("Bigger Context compaction selects six parts', start)
          block = t[start:end]
          needle = 'estimateTokens(proMessages[0]!), proMessages[0]!.length,\n  ).effort).toBe("max");'
          if needle not in block:
              raise SystemExit("planner effort expectation changed")
          block = block.replace(needle, 'estimateTokens(proMessages[0]!), proMessages[0]!.length,\n  ).effort).toBe("low");', 1)
          if '}, 60_000);' not in block:
              raise SystemExit("planner timeout anchor changed")
          block = block.replace('}, 60_000);', '}, 90_000);', 1)
          p.write_text(t[:start] + block + t[end:])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/chatgpt-web-usage.test.ts
          git diff --cached --check
          git commit -m "test: update six-part planner staging expectation"
          git push origin HEAD:sync
