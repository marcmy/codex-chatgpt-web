name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate launcher installer with Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
          }
          $source = Get-Content scripts/install-launcher.ps1 -Raw
          [void][scriptblock]::Create($source)
          if ($source.Contains("IsPathFullyQualified")) {
            throw "The Windows PowerShell 5.1 installer cannot use the .NET Core-only IsPathFullyQualified API"
          }
          if (-not [Environment]::Is64BitOperatingSystem) {
            throw "The Windows CI runner must be 64-bit"
          }

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile --cwd launcher

      - name: Prepare AVX2-independent Windows runtime
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.0 -GitHubEnv $env:GITHUB_ENV

      - name: Lint GitHub Actions
        shell: pwsh
        run: |
          $files = Get-ChildItem .github/workflows/*.yml | ForEach-Object { $_.FullName }
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -config-file .github/actionlint.yaml $files

      - name: Verify
        run: bun run verify

      - name: Package Windows app
        run: bun run app:package

      - name: Smoke packaged app
        run: bun run app:smoke

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: codex-web-gpt-windows
          path: launcher/artifacts/*
          if-no-files-found: error
          compression-level: 0
