name: Temporary security lockfile refresh
on:
  push:
    branches: [fix/security-dependency-refresh-20261024]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Regenerate lock and verify advisories
        shell: bash
        run: |
          set -euo pipefail
          bun install --ignore-scripts
          bun audit fix
          bun audit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/audit-fix.yml
          git add package.json bun.lock
          if git diff --cached --quiet; then
            echo "No dependency changes generated" >&2
            exit 1
          fi
          git commit -m "fix(deps): resolve Bun security advisories"
          git push origin HEAD:refs/heads/fix/security-dependency-refresh-20261024
