name: Temporary launcher security lockfile refresh
on:
  push:
    branches: [fix/security-dependency-refresh-20261024]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Refresh launcher dependencies and remove helper
        shell: bash
        run: |
          set -euo pipefail
          cd launcher
          bun install --ignore-scripts
          bun audit fix
          bun audit
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/audit-fix.yml
          git add launcher/package.json launcher/bun.lock
          git diff --cached --quiet && exit 1 || true
          git commit -m "fix(launcher): remediate Electron, Vite and transitive advisories"
          git push origin HEAD:refs/heads/fix/security-dependency-refresh-20261024
