name: One-shot CodeQL security fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/code-scanning-alerts
          fetch-depth: 0

      - name: Apply focused CodeQL fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          
          p = Path("launcher/electron/browser-host.cjs")
          t = p.read_text()
          anchor = "function isTemporaryChatUrl(value) {"
          helper = """function isChatGptOriginUrl(value) {
            try {
              return new URL(value).origin === CHATGPT_ORIGIN;
            } catch {
              return false;
            }
          }
          
          """
          if "function isChatGptOriginUrl(value)" not in t:
              assert anchor in t
              t = t.replace(anchor, helper + anchor, 1)
          t = t.replace("tab.url.startsWith(CHATGPT_ORIGIN)", "isChatGptOriginUrl(tab.url)")
          t = t.replace("!url.startsWith(CHATGPT_ORIGIN)", "!isChatGptOriginUrl(url)")
          t = t.replace("!current.startsWith(CHATGPT_ORIGIN)", "!isChatGptOriginUrl(current)")
          assert ".startsWith(CHATGPT_ORIGIN)" not in t
          p.write_text(t)
          
          p = Path("src/adapters/chatgpt-web/environment.ts")
          t = p.read_text()
          old = """  return value
              .replaceAll("&lt;", "<")
              .replaceAll("&gt;", ">")
              .replaceAll("&amp;", "&")
              .replaceAll("&quot;", "\\\"")
              .replaceAll("&#39;", "'");
          """
          new = """  return value
              .replaceAll("&lt;", "<")
              .replaceAll("&gt;", ">")
              .replaceAll("&quot;", "\\\"")
              .replaceAll("&#39;", "'")
              .replaceAll("&amp;", "&");
          """
          assert old in t
          p.write_text(t.replace(old, new, 1))
          
          p = Path("src/bridge.ts")
          t = p.read_text()
          old = """export function formatErrorResponse(status: number, type: string, message: string): Response {
            return new Response(JSON.stringify({ error: classifyError(status, type, message) }), {
              status, headers: { "Content-Type": "application/json" },
            });
          }"""
          new = """export function formatErrorResponse(status: number, type: string, message: string): Response {
            const classified = classifyError(status, type, message);
            const publicError: CodexErrorPayload = {
              ...classified,
              message: "Request failed (" + (classified.code ?? classified.type ?? "unknown_error") + ")",
            };
            return new Response(JSON.stringify({ error: publicError }), {
              status, headers: { "Content-Type": "application/json" },
            });
          }"""
          assert old in t
          p.write_text(t.replace(old, new, 1))
          
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher/electron/browser-host.cjs src/adapters/chatgpt-web/environment.ts src/bridge.ts
          git diff --cached --check
          git commit -m "fix: resolve CodeQL security alerts"
          git push origin HEAD:fix/code-scanning-alerts
