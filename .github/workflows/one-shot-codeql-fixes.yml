name: One-shot CodeQL security fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/code-scanning-alerts
          fetch-depth: 0

      - name: Apply focused CodeQL fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          {
            const path = "launcher/electron/browser-host.cjs";
            let text = fs.readFileSync(path, "utf8");

            const anchor = "function isTemporaryChatUrl(value) {";
            const helper = `function isChatGptOriginUrl(value) {
  try {
    return new URL(value).origin === CHATGPT_ORIGIN;
  } catch {
    return false;
  }
}

`;
            if (!text.includes("function isChatGptOriginUrl(value)")) {
              if (!text.includes(anchor)) throw new Error("browser-host helper anchor missing");
              text = text.replace(anchor, helper + anchor);
            }

            text = text.replaceAll("tab.url.startsWith(CHATGPT_ORIGIN)", "isChatGptOriginUrl(tab.url)");
            text = text.replaceAll("!url.startsWith(CHATGPT_ORIGIN)", "!isChatGptOriginUrl(url)");
            text = text.replaceAll("!current.startsWith(CHATGPT_ORIGIN)", "!isChatGptOriginUrl(current)");

            if (text.includes(".startsWith(CHATGPT_ORIGIN)")) {
              throw new Error("unconverted CHATGPT_ORIGIN startsWith check remains");
            }
            fs.writeFileSync(path, text);
          }

          {
            const path = "src/adapters/chatgpt-web/environment.ts";
            let text = fs.readFileSync(path, "utf8");
            const oldBlock = `  return value
    .replaceAll("&lt;", "<")
    .replaceAll("&gt;", ">")
    .replaceAll("&amp;", "&")
    .replaceAll("&quot;", "\\\"")
    .replaceAll("&#39;", "'");`;
            const newBlock = `  return value
    .replaceAll("&lt;", "<")
    .replaceAll("&gt;", ">")
    .replaceAll("&quot;", "\\\"")
    .replaceAll("&#39;", "'")
    .replaceAll("&amp;", "&");`;
            if (!text.includes(oldBlock)) throw new Error("decodeXmlText block changed");
            text = text.replace(oldBlock, newBlock);
            fs.writeFileSync(path, text);
          }

          {
            const path = "src/bridge.ts";
            let text = fs.readFileSync(path, "utf8");
            const oldBlock = `export function formatErrorResponse(status: number, type: string, message: string): Response {
  return new Response(JSON.stringify({ error: classifyError(status, type, message) }), {
    status, headers: { "Content-Type": "application/json" },
  });
}`;
            const newBlock = `export function formatErrorResponse(status: number, type: string, message: string): Response {
  const classified = classifyError(status, type, message);
  const publicError: CodexErrorPayload = {
    ...classified,
    message: \`Request failed (\${classified.code ?? classified.type ?? "unknown_error"})\`,
  };
  return new Response(JSON.stringify({ error: publicError }), {
    status, headers: { "Content-Type": "application/json" },
  });
}`;
            if (!text.includes(oldBlock)) throw new Error("formatErrorResponse block changed");
            text = text.replace(oldBlock, newBlock);
            fs.writeFileSync(path, text);
          }
          NODE

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher/electron/browser-host.cjs src/adapters/chatgpt-web/environment.ts src/bridge.ts
          git diff --cached --check
          git commit -m "fix: resolve CodeQL security alerts"
          git push origin HEAD:fix/code-scanning-alerts
