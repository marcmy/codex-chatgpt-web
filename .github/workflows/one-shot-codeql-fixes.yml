name: One-shot CodeQL security fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/code-scanning-alerts
          fetch-depth: 0

      - name: Patch exact ChatGPT origin checks
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("launcher/electron/browser-host.cjs"); t=p.read_text(); a="function isTemporaryChatUrl(value) {"; h="function isChatGptOriginUrl(value) {\\n  try {\\n    return new URL(value).origin === CHATGPT_ORIGIN;\\n  } catch {\\n    return false;\\n  }\\n}\\n\\n"; t=t if "function isChatGptOriginUrl(value)" in t else t.replace(a,h+a,1); t=t.replace("tab.url.startsWith(CHATGPT_ORIGIN)","isChatGptOriginUrl(tab.url)").replace("!url.startsWith(CHATGPT_ORIGIN)","!isChatGptOriginUrl(url)").replace("!current.startsWith(CHATGPT_ORIGIN)","!isChatGptOriginUrl(current)"); assert ".startsWith(CHATGPT_ORIGIN)" not in t; p.write_text(t)'

      - name: Fix XML entity decode order
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("src/adapters/chatgpt-web/environment.ts"); t=p.read_text(); old=".replaceAll(\\"&gt;\\", \\">\\")\\n    .replaceAll(\\"&amp;\\", \\"&\\")\\n    .replaceAll(\\"&quot;\\", \\"\\\\\\\"\\")\\n    .replaceAll(\\"&#39;\\", \\"\x27\\");"; new=".replaceAll(\\"&gt;\\", \\">\\")\\n    .replaceAll(\\"&quot;\\", \\"\\\\\\\"\\")\\n    .replaceAll(\\"&#39;\\", \\"\x27\\")\\n    .replaceAll(\\"&amp;\\", \\"&\\");"; assert old in t; p.write_text(t.replace(old,new,1))'

      - name: Remove stack traces from external error responses
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("src/bridge.ts"); t=p.read_text(); old="export function formatErrorResponse(status: number, type: string, message: string): Response {\\n  return new Response(JSON.stringify({ error: classifyError(status, type, message) }), {\\n    status, headers: { \\"Content-Type\\": \\"application/json\\" },\\n  });\\n}"; new="export function formatErrorResponse(status: number, type: string, message: string): Response {\\n  const classified = classifyError(status, type, message);\\n  const publicError: CodexErrorPayload = {\\n    ...classified,\\n    message: \\"Request failed (\\" + (classified.code ?? classified.type ?? \\"unknown_error\\") + \\")\\",\\n  };\\n  return new Response(JSON.stringify({ error: publicError }), {\\n    status, headers: { \\"Content-Type\\": \\"application/json\\" },\\n  });\\n}"; assert old in t; p.write_text(t.replace(old,new,1))'

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher/electron/browser-host.cjs src/adapters/chatgpt-web/environment.ts src/bridge.ts
          git diff --cached --check
          git commit -m "fix: resolve CodeQL security alerts"
          git push origin HEAD:fix/code-scanning-alerts
