name: One-shot Planner Test Timeout

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/unified-web-model-steering
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Raise CPU-heavy planner test timeout
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/chatgpt-web-usage.test.ts")
          text = path.read_text()
          marker = 'test("multipart selection accounts for whole-record and composer fit before submission", () => {'
          start = text.index(marker)
          end = text.index('\n\ntest(', start + len(marker))
          block = text[start:end]
          old = '}, 90_000);'
          if block.count(old) != 1:
              raise SystemExit(f"expected exactly one 90s timeout in target test, found {block.count(old)}")
          block = block.replace(old, '}, 180_000);')
          path.write_text(text[:start] + block + text[end:])
      - name: Verify target test
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun test tests/chatgpt-web-usage.test.ts
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/chatgpt-web-usage.test.ts
          git commit -m "test: give multipart planner timing headroom"
          git push origin HEAD:feature/unified-web-model-steering
