name: One-shot unified Web model and steering

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/unified-web-model-steering
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Apply feature patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show a2b789ed452301553b23768384bb753c4bc23fa7:.github/workflows/one-shot-unified-web-steering.yml             | grep '^H4sI' > /tmp/feature.patch.gz.b64
          base64 -d /tmp/feature.patch.gz.b64 | gzip -dc > /tmp/feature.patch
          git apply --check /tmp/feature.patch
          git apply /tmp/feature.patch
          python <<'PY'
          from pathlib import Path

          path = Path("src/adapters/chatgpt-web/index.ts")
          text = path.read_text()
          old = 'import { CHATGPT_WEB_LUNA_MODEL_ID, resolveChatGptWebModelMode, type ChatGptWebCapabilities } from "./model";'
          new = 'import { CHATGPT_WEB_LUNA_MODEL_ID, CHATGPT_WEB_MODEL_ID, resolveChatGptWebModelMode, type ChatGptWebCapabilities } from "./model";'
          if old not in text:
              raise SystemExit("index.ts model import changed")
          path.write_text(text.replace(old, new, 1))

          path = Path("src/model-catalog.ts")
          text = path.read_text()
          text = text.replace("  CHATGPT_WEB_LEGACY_MODEL_ROUTES,\n", "")
          old = '''  const visibleRoutes = config.subagentProtocol === "compatibility-v1" && config.solAvailable
              ? CHATGPT_WEB_LEGACY_MODEL_ROUTES.filter(route =>
                (!route.requiresPro || config.proAvailable)
                && (!route.requiresExtraHigh || config.extraHighAvailable))
              : availableChatGptWebModelRoutes(config);
          '''
          new = '''  const visibleRoutes = availableChatGptWebModelRoutes(config);
          '''
          if old not in text:
              raise SystemExit("model-catalog visible route block changed")
          path.write_text(text.replace(old, new, 1))

          path = Path("tests/model-catalog.test.ts")
          text = path.read_text()
          text = text.replace("  CHATGPT_WEB_LEGACY_MODEL_ROUTES,\n", "")
          old = '''    expect(spawnOverrides).toEqual([
                "gpt-5.6-sol",
                ...CHATGPT_WEB_LEGACY_MODEL_ROUTES.slice(1).map(route => route.slug),
              ]);
              expect(models.find(model => model.slug === "chatgpt-web/light")?.priority).toBe(3);
          '''
          new = '''    expect(spawnOverrides).toEqual([
                "gpt-5.6-sol",
                CHATGPT_WEB_MODEL_ROUTE.slug,
              ]);
              expect(models.find(model => model.slug === CHATGPT_WEB_MODEL_ROUTE.slug)?.priority).toBe(2);
          '''
          if old not in text:
              raise SystemExit("Compatibility V1 catalog assertion changed")
          text = text.replace(old, new, 1)
          text = text.replace("    expect(web.length).toBe(3);", "    expect(web.length).toBe(1);", 1)
          text = text.replace("    expect(web).toHaveLength(3);", "    expect(web).toHaveLength(1);", 1)
          path.write_text(text)

          path = Path("tests/server-models.test.ts")
          text = path.read_text()
          old = '''  expect(body.models.filter(model => model.slug.startsWith("chatgpt-web/")))
              .toHaveLength(3);
          '''
          new = '''  expect(body.models.filter(model => model.slug.startsWith("chatgpt-web/")))
              .toHaveLength(1);
          '''
          if old not in text:
              raise SystemExit("server-models web-row count changed")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Verify
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd launcher
          bun run verify

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "feat: unify ChatGPT Web effort picker and steering fallback"
          git push origin HEAD:feature/unified-web-model-steering
