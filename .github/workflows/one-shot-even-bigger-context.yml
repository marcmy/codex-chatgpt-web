name: One-shot Even Bigger Context

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/unified-web-model-steering
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Apply feature patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/one-shot-even.patch.gz.b64 | base64 -d | gzip -dc > /tmp/even.patch
          git apply --check /tmp/even.patch
          git apply /tmp/even.patch
          git diff --check
      - name: Verify
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd launcher
          bun run verify
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src launcher tests
          git commit -m "feat: add Even Bigger Context experimental mode"
          git push origin HEAD:feature/unified-web-model-steering
