name: One-shot compaction auth reconnect fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/compaction-auth-reconnect
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Apply auth reconnect patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/authfix.patch.gz.b64 <<'B64'

          B64
          base64 -d /tmp/authfix.patch.gz.b64 | gzip -dc > /tmp/authfix.patch
          git apply --check /tmp/authfix.patch
          git apply /tmp/authfix.patch
          git diff --check

      - name: Verify
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd launcher
          bun run verify

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher src tests
          git commit -m "fix: stop retrying turns after ChatGPT auth expiry"
          git push origin HEAD:fix/compaction-auth-reconnect
