name: One-shot reconcile PR67 transport tests

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync
      - name: Reconcile six-part transport contracts
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          
          p = Path("src/adapters/chatgpt-web/browser-worker.ts")
          t = p.read_text()
          old = """      if (prepared.multipart) {
                  assertChatGptWebMultipartInputWithinLimits(
                    estimatedInputTokens,
                    estimatedMessageTokens,
                    turn.modelId,
                    requestedMode.effort,
                    browserCapabilities,
                    maxMessageChars,
                    prepared.multipart.parts.length,
          """
          new = """      if (prepared.multipart) {
                  const partCount = prepared.multipart.parts.length;
                  if (!isChatGptWebMultipartPartCount(partCount)) {
                    throw new Error("Browser worker received an unsupported multipart transport shape");
                  }
                  assertChatGptWebMultipartInputWithinLimits(
                    estimatedInputTokens,
                    estimatedMessageTokens,
                    turn.modelId,
                    requestedMode.effort,
                    browserCapabilities,
                    maxMessageChars,
                    partCount,
          """
          if old not in t:
              raise SystemExit("browser-worker multipart preflight anchor changed")
          p.write_text(t.replace(old, new, 1))
          
          p = Path("tests/chatgpt-web-usage.test.ts")
          t = p.read_text()
          t = t.replace('[[50_000, 40_000, 50_000, 5_000].map(n => "word ".repeat(n)), 3],',
                        '[[50_000, 40_000, 50_000, 5_000].map(n => "word ".repeat(n)), 6],', 1)
          t = t.replace('[Array.from({ length: 4 }, () => "word ".repeat(50_000)), 4],',
                        '[Array.from({ length: 4 }, () => "word ".repeat(50_000)), 6],', 1)
          t = t.replace('test("Bigger Context compaction uses a fourth transport part before trimming history", () => {',
                        'test("Bigger Context compaction uses six transport parts before trimming history", () => {', 1)
          t = t.replace('  expect(parts).toBe(4);', '  expect(parts).toBe(6);', 1)
          t = t.replace('  expect(compiled.multipart?.parts).toHaveLength(4);',
                        '  expect(compiled.multipart?.parts).toHaveLength(6);', 1)
          t = t.replace('{ experimentalMultipartParts: 4 });', '{ experimentalMultipartParts: 6 });', 1)
          t = t.replace('  expect(forced.multipart?.parts).toHaveLength(4);',
                        '  expect(forced.multipart?.parts).toHaveLength(6);', 1)
          p.write_text(t)
          
          p = Path("tests/browser-worker-contract.test.ts")
          t = p.read_text()
          old_four = """  expect(() => assertChatGptWebMultipartInputWithinLimits(
              269_999,
              80_000,
              "gpt-5.6-sol",
              "high",
              plus,
              900_000,
              4,
            )).not.toThrow();
            expect(() => assertChatGptWebMultipartInputWithinLimits(
              270_000,
              80_000,
              "gpt-5.6-sol",
              "high",
              plus,
              900_000,
              4,
            )).toThrow("270,000-token four-transport-part ceiling");
          """
          if old_four not in t:
              raise SystemExit("browser-worker old four-part assertions changed")
          t = t.replace(old_four, "", 1)
          old_helper = """test("the launcher helper accepts the fourth Bigger Context spill part", () => {
            const helper = readFileSync("src/adapters/chatgpt-web/browser-helper-main.ts", "utf8");
          
            // Bigger Context still has three logical windows, but #61 added a fourth physical transport
            // spill part. The out-of-process helper must share that transport bound instead of hard-coding
            // the older 2/3-part protocol or it aborts the first run and every reconnect collides with it.
            expect(helper).toContain("CHATGPT_BIGGER_CONTEXT_MAX_TRANSPORT_PARTS");
            expect(helper).toMatch(/multipart\\.parts\\.length > CHATGPT_BIGGER_CONTEXT_MAX_TRANSPORT_PARTS/);
            expect(helper).not.toContain("multipart.parts.length !== 2 && multipart.parts.length !== 3");
          });
          """
          new_helper = """test("the launcher helper validates the six-part Bigger Context protocol", () => {
            const helper = readFileSync("src/adapters/chatgpt-web/browser-helper-main.ts", "utf8");
          
            // Physical Bigger Context transport now has exactly two supported shapes: two or six parts.
            // Keep the out-of-process helper on the same validator as the compiler so stale 3/4-part
            // payloads fail before they can create a mismatched browser transaction.
            expect(helper).toContain("isChatGptWebMultipartPartCount");
            expect(helper).toMatch(/!isChatGptWebMultipartPartCount\\(multipart\\.parts\\.length\\)/);
            expect(helper).not.toContain("multipart.parts.length !== 2 && multipart.parts.length !== 3");
          });
          """
          if old_helper not in t:
              raise SystemExit("browser-worker helper contract anchor changed")
          p.write_text(t.replace(old_helper, new_helper, 1))
          
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adapters/chatgpt-web/browser-worker.ts tests/browser-worker-contract.test.ts tests/chatgpt-web-usage.test.ts
          git diff --cached --check
          git commit -m "test: reconcile six-part transport contracts"
          git push origin HEAD:sync
