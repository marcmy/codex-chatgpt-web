name: One-shot PR66 bridge fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/code-scanning-alerts
          fetch-depth: 0

      - name: Preserve single-line errors without exposing stack frames
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("src/bridge.ts")
          text = path.read_text()
          old = """export function formatErrorResponse(status: number, type: string, message: string): Response {
            const classified = classifyError(status, type, message);
            const publicError: CodexErrorPayload = {
              ...classified,
              message: "Request failed (" + (classified.code ?? classified.type ?? "unknown_error") + ")",
            };
            return new Response(JSON.stringify({ error: publicError }), {
              status, headers: { "Content-Type": "application/json" },
            });
          }"""
          new = """export function formatErrorResponse(status: number, type: string, message: string): Response {
            const classified = classifyError(status, type, message);
            const publicError: CodexErrorPayload = {
              ...classified,
              message: message.split(/\\r?\\n/, 1)[0] ?? "",
            };
            return new Response(JSON.stringify({ error: publicError }), {
              status, headers: { "Content-Type": "application/json" },
            });
          }"""
          if old not in text:
              raise SystemExit("formatErrorResponse block changed")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bridge.ts
          git diff --cached --check
          git commit -m "fix: preserve single-line error details"
          git push origin HEAD:fix/code-scanning-alerts
