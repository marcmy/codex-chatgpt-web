name: One-shot Retention Probe Finalize

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/unified-web-model-steering
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Add raw first-line diagnostics
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/adapters/chatgpt-web/browser-worker.ts")
          s = p.read_text()
          old = 'unexpected=${retentionResult.unexpected.length}`;'
          new = 'unexpected=${retentionResult.unexpected.length}${retentionResult.observedFirstLine !== undefined ? ` observedFirstLine=${JSON.stringify(retentionResult.observedFirstLine)}` : ""}`;'
          if s.count(old) != 1:
              raise SystemExit(f"expected one diagnostics suffix, found {s.count(old)}")
          p.write_text(s.replace(old, new, 1))
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd launcher
          bun test tests/retention-probe.test.ts tests/prompt-contract.test.ts tests/browser-worker-contract.test.ts
          bun run verify
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adapters/chatgpt-web/browser-worker.ts
          git commit -m "fix: log malformed retention report first line"
          git push origin HEAD:feature/unified-web-model-steering
