name: One-shot Retention Probe Protocol V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/unified-web-model-steering
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Apply protocol patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/retention-v2.py.gz.b64 | base64 -d | gzip -dc > /tmp/patch.py
          python /tmp/patch.py
          git diff --check
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd launcher
          bun test tests/prompt-contract.test.ts tests/browser-worker-contract.test.ts
          bun run verify
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "fix: harden Even Bigger retention report protocol"
          git push origin HEAD:feature/unified-web-model-steering
