name: Fix launcher dependency audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-launcher-audit.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ github.token }}
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Repair launcher audit
        shell: bash
        run: |
          set -euo pipefail
          cd launcher
          bun audit fix
          bun audit

      - name: Commit launcher dependency repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher/package.json launcher/bun.lock
          if git diff --cached --quiet; then
            echo "No launcher dependency changes required."
            exit 0
          fi
          git commit -m "fix(deps): repair launcher audit"
          git push origin HEAD:refs/heads/main
