name: Finalize rate-limit runtime
on:
  push:
    branches: [rate-limit-backoff]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/adapters/chatgpt-web/rate-limit-runtime-patch.ts')
          s = p.read_text()
          s = s.replace(
          '''  abortSignal?: AbortSignal,\n): Promise<void> {\n  await chatGptRateLimitSerialGate.runExclusive(async () => {''',
          '''  abortSignal?: AbortSignal,\n  acquireActionPermit = true,\n): Promise<void> {\n  await chatGptRateLimitSerialGate.runExclusive(async () => {''', 1)
          old = '''    await waitForChatGptRateLimitDeadline(\n      chatGptRateLimitBackoffPolicy.nextAllowedActionAt(),\n      abortSignal,\n    );\n    chatGptRateLimitBackoffPolicy.recordAction();'''
          new = '''    if (!acquireActionPermit) return;\n    await waitForChatGptRateLimitDeadline(\n      chatGptRateLimitBackoffPolicy.nextAllowedActionAt(),\n      abortSignal,\n    );\n    chatGptRateLimitBackoffPolicy.recordAction();'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''          await waitForExistingRateLimitRecovery(descriptorPath, surfaceId, turn.abortSignal);\n\n          // Once Send may have fired, replaying the prompt is unsafe. Recovery is still completed,\n          // but the prompt itself is not sent again.\n          if (sendActivated) throw error;'''
          new = '''          await waitForExistingRateLimitRecovery(\n            descriptorPath,\n            surfaceId,\n            turn.abortSignal,\n            !sendActivated,\n          );\n\n          // Once Send may have fired, replaying the prompt is unsafe. Complete only cooldown + refresh;\n          // do not consume a phantom action permit when this turn is about to fail without touching the site.\n          if (sendActivated) throw error;'''
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/finalize-rate-limit-runtime.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/adapters/chatgpt-web/rate-limit-runtime-patch.ts
          git commit -m 'Avoid phantom post-send recovery permits'
          git push origin HEAD:rate-limit-backoff