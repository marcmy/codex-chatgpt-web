version: 2

updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      routine-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-dependencies:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "bun"
    directory: "/launcher"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      routine-launcher-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-launcher-dependencies:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      routine-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-actions:
        patterns:
          - "*"
        update-types:
          - "major"
