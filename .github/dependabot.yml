version: 2

updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Bun's runtime and type package are intentionally pinned in lockstep.
      # packageManager is not managed by Dependabot, so update both manually.
      - dependency-name: "@types/bun"
      # MCP SDK v1.30.0's Zod compatibility types currently reject Zod 4.5+
      # even though 4.4.3 typechecks in this repo. Revisit when the SDK is upgraded.
      - dependency-name: "zod"
        versions:
          - ">= 4.5.0, < 5"
    groups:
      routine-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bun"
    directory: "/launcher"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      routine-launcher-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      routine-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
